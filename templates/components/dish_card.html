
{% load static %}

<article
    class="group overflow-hidden rounded-2xl border border-primary/10 bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-xl"
>
    <div class="overflow-hidden">
        <img
            src="{% static image %}"
            alt="{{ alt }}"
            loading="lazy"
            decoding="async"
            class="aspect-4/3 w-full object-cover transition-transform duration-500 group-hover:scale-105"
        >
    </div>

    <div class="p-5 sm:p-6">
        {% if tag %}
            <p class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-primary">
                {{ tag }}
            </p>
        {% endif %}

        <h3 class="font-heading text-2xl font-semibold text-text">
            {{ name }}
        </h3>

        <p class="mt-2 text-sm leading-6 text-brown/80">
            {{ description }}
        </p>
    </div>
</article>
